<section class="password">
    <div class="password__container container">
        <h1 class="password__title">Новый пароль</h1>
        <div class="password__box">
            <div class="password__illustration" aria-hidden="true"><svg width="140" height="140" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="27" y="43" width="46" height="40" rx="6"/><path d="M35 43V29a15 15 0 0 1 30 0v14M50 59v10"/></svg></div>
            <form class="password__form" data-password-form="reset" method="post">
                <h2 class="password__heading">Придумайте новый пароль</h2>
                <p class="password__description">Используйте пароль, который не применяете на других сайтах.</p>
                <div class="password__input">
                    <label for="password">Новый пароль</label>
                    <div class="password__field">
                        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
                        <button class="password__toggle" type="button" aria-label="Показать пароль" aria-controls="password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>
                <p class="password__hint" id="password-hint">Не менее 8 символов</p>
                <div class="password__input">
                    <label for="password_confirmation">Повторите пароль</label>
                    <div class="password__field">
                        <input id="password_confirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required>
                        <button class="password__toggle" type="button" aria-label="Показать пароль" aria-controls="password_confirmation" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>
                <button class="password__button" type="submit" disabled>Сохранить пароль <span aria-hidden="true">→</span></button>
                <p class="password__message" role="status">Смена пароля будет доступна после подключения WordPress.</p>
                <a class="password__retry" href="./forgot-password.html">Запросить новую ссылку</a>
                <noscript>Для отправки формы включите JavaScript.</noscript>
            </form>
        </div>
        <a class="password__back" href="./entrance.html">← Вернуться ко входу</a>
    </div>
</section>
