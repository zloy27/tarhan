<section class="password">
    <div class="password__container container">
        <h1 class="password__title">Восстановление пароля</h1>
        <div class="password__box">
            <div class="password__illustration" aria-hidden="true"><svg width="140" height="140" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="10" y="23" width="80" height="54" rx="4"/><path d="m12 26 38 30 38-30"/></svg></div>
            <form class="password__form" data-password-form="forgot" method="post">
                <h2 class="password__heading">Забыли пароль?</h2>
                <p class="password__description">Введите email, указанный при регистрации. Мы отправим ссылку для смены пароля.</p>
                <div class="password__input">
                    <label for="email">Электронная почта</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="Введите email" required>
                </div>
                <button class="password__button" type="submit" disabled>Отправить ссылку <span aria-hidden="true">→</span></button>
                <p class="password__hint">Если аккаунт существует, письмо придёт на указанную почту.</p>
                <p class="password__message" role="status">Отправка писем будет доступна после подключения WordPress.</p>
                <noscript>Для отправки формы включите JavaScript.</noscript>
            </form>
        </div>
        <a class="password__back" href="./entrance.html">← Вернуться ко входу</a>
    </div>
</section>
